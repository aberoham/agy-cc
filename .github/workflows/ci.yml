name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - name: Lint and type check
        run: |
          uvx ruff@0.16.6 check plugins tests
          uvx ruff@0.16.6 format --check plugins tests
          uvx --python 3.13 --with pytest==9.1.1 ty@0.0.78 check plugins tests
      - name: Tests
        run: uv run --no-project --python ${{ matrix.python }} --with 'pytest>=8.4,<10' pytest -q
