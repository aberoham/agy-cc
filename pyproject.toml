# Development tooling only. The plugin itself uses the standard library and
# runs on Python 3.9 or later, including the macOS system Python.
[project]
name = "agy-plugin-cc"
version = "0.0.0"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S603", "S607", "S101", "S602", "S108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/agy/scripts", "tests"]

[tool.ty.environment]
python-version = "3.9"
extra-paths = ["plugins/agy/scripts", "tests"]
